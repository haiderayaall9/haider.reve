    <h1><i class="fa-solid fa-wand-magic-sparkles"></i> ممحاة الخلفية الذكية</h1>
    <p>ارفع صورتك الآن ودع السيرفر يفصل الخلفية عنها بثوانٍ بكل احترافية.</p>
    
    <label class="upload-btn">
        <i class="fa-solid fa-cloud-arrow-up"></i> اختر صورة من جهازك
        <input type="file" id="imageInput" accept="image/*">
    </label>

    <div class="loading" id="loadingText">
        <i class="fa-solid fa-circle-notch"></i> جاري معالجة الصورة الذكية بدقة...
    </div>

    <div class="preview-box">
        <div id="originalContainer" class="preview-col" style="display:none;">
            <h3><i class="fa-solid fa-image"></i> الصورة الأصلية</h3>
            <img id="originalImage" src="" alt="الأصلية">
        </div>
        <div id="resultContainer" class="preview-col" style="display:none;">
            <h3><i class="fa-solid fa-file-image"></i> النتيجة الشفافة</h3>
            <img id="resultImage" src="" alt="النتيجة">
            <a id="downloadBtn" class="download-btn" download="no-bg.png">
                <i class="fa-solid fa-download"></i> تحميل الصورة
            </a>
        </div>
    </div>
</div>

<script>
    const API_KEY = "UvE8iyKLFQK6rZARb5fN8ui3";

    const imageInput = document.getElementById('imageInput');
    const originalImage = document.getElementById('originalImage');
    const resultImage = document.getElementById('resultImage');
    const loadingText = document.getElementById('loadingText');
    const downloadBtn = document.getElementById('downloadBtn');
    
    const originalContainer = document.getElementById('originalContainer');
    const resultContainer = document.getElementById('resultContainer');

    imageInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        // استعراض الصورة الأصلية فوراً وبسلاسة
        const originalUrl = URL.createObjectURL(file);
        originalImage.src = originalUrl;
        originalContainer.style.display = 'flex';
        
        resultContainer.style.display = 'none';
        downloadBtn.style.display = 'none';
        loadingText.style.display = 'block';

        const formData = new FormData();
        formData.append('image_file', file);
        formData.append('size', 'auto');

        try {
            const response = await fetch('https://api.remove.bg/v1.0/removebg', {
                method: 'POST',
                headers: {
                    'X-Api-Key': API_KEY
                },
                body: formData
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.errors[0].title || 'فشلت المعالجة');
            }

            const blob = await response.blob();
            const resultUrl = URL.createObjectURL(blob);
            
            resultImage.src = resultUrl;
            downloadBtn.href = resultUrl;
            
            loadingText.style.display = 'none';
            resultContainer.style.display = 'flex';
            downloadBtn.style.display = 'inline-flex';
        } catch (error) {
            console.error(error);
            alert('حدث خطأ أثناء الاتصال بالسيرفر: ' + error.message);
            loadingText.style.display = 'none';
        }
    });
</script>

</body>
